# The whole screen covered by reconstructions with a growing N, in a grid – nothing else.
#
# How the grid is made:
#   - one frame per item of "reconstructions" (here 20);
#   - "columns" = cells in a row; there are as many rows as the frames need, so the grid is the same on
#     every screen – only the size of the cells follows the box (here nearly the whole screen);
#   - cells are numbered row by row from 0, left to right; "empty" cells are left free and the frames
#     take the next ones, in the order of "reconstructions".
#
# 16:9 / 16:10: columns = 5 – 4 rows of 5.
# Ultrawide: columns = 8, empty = [0, 1, 8, 9] – 24 cells in 3 rows, the top-left 2 × 2 free for the
# desktop widget:
#    0  1 |  2  3  4  5  6  7          ·   ·   N=1  N=2  N=3  N=4  N=5  N=6
#    8  9 | 10 11 12 13 14 15    →     ·   ·   N=7  N=8  N=10 N=12 N=14 N=16
#   16 17   18 19 20 21 22 23         N=18 N=20 N=24 N=28 N=32 N=40 N=50 N=60
# Without a widget there: empty = [] and 4 more items in "reconstructions" (8 × 3 = 24).

[general]
reconstructions = [1, 2, 3, 4, 5, 6, 7, 8, 10, 12, 14, 16, 18, 20, 24, 28, 32, 40, 50, 60]

[layout]
drawing        = { enabled = false }
theory         = { enabled = false }
square         = { enabled = false }
spectrum       = { enabled = false }
title          = { enabled = false }
reconstruction = { x = 60, y = 40, w = -120, h = -100, columns = 5 }

[layout_ultrawide]
reconstruction = { columns = 8, empty = [0, 1, 8, 9] }
