# Fourier wallpaper generator – the defaults. Other files override them, key by key, in this order:
#   config.toml  →  the recipe  →  configs/<wallpaper>.toml  →  layouts/<layout>.toml  →  the recipe's entry
#   →  the command line.   A recipe (recipes/*.toml) says which wallpapers to make – see recipes/default.toml.
# A wallpaper file has a [wallpaper] table (the graphic and its texts); any file can have any section from
# here. A file can also build on another one with extends = "other.toml" (relative to that file).
# Values from [general] and [colors] can be overridden on the command line (python3 fourier.py --help).

[general]
language = ["pl", "en"]                        # files languages/<language>.toml; one language: "pl"
resolutions = ["3440x1440", "1920x1200"]       # every wallpaper in every resolution
layouts = ["default"]                          # every wallpaper in every layout: names of files in layouts/,
                                               # "default" = no file (only this one and the wallpaper's)
output = "../{resolution}"                     # directory for the PNG files (relative to this file);
                                               # {resolution} → a folder per resolution, e.g. ../3440x1440;
                                               # file name: fourier-<wallpaper>[-<layout>]-<language>_<resolution>.png
title = "AMBERFROST // FOURIER"                # large text on the title block in the bottom-right corner
revision = "A  2026"
font = "Hack"                                  # must have Σ ∫ π (Hack, DejaVu Sans Mono…)
circles = 40                                   # default n = −40…40, i.e. 81 circles
reconstructions = [1, 3, 8, 30]                # N in the right-hand column (2N+1 circles)
graphic_colors = 3                             # how many colours to split the graphic into when looking for inner lines

[colors]                                       # AmberFrost palette (Noctalia)
background = "#1B1B1B"
accent = "#FFAD00"                             # trace, headers, formulas, n > 0
accent2 = "#AABBFF"                            # chain of circles, n < 0
text = "#BEBEBE"
lines = "#4A4A4A"                              # target outline (dashed), header rules
details = "#333333"                            # inner lines of the graphic

# ---------------------------------------------------------------------------------------------
# Modules of the wallpaper and their boxes. Keys (all optional – missing ones keep the defaults below):
#   enabled = false      – the module is not drawn (also: --hide MODULE / --show MODULE on the command line),
#   x, y                 – top-left corner, w, h – size: a number is px on a 1440 px high screen (scaled with
#                          the height, so 1920x1200 gets × 0.83), "N%" is percent of the screen width (x, w)
#                          or height (y, h); a negative x / y = distance of the module's right / bottom edge
#                          from the right / bottom edge of the screen; a negative w / h = the screen width /
#                          height minus that much (w = -120: full width less 2 × 60),
#   scale = 1.2          – text and line sizes inside the module,
#   labels = false       – drawing only: no c₀, c₁… and no label at the small shapes,
#   align = "left"       – drawing only: the graphic at the left / right edge of its box (default "center"),
#   direction = "row"    – reconstruction only: frames side by side instead of one above the other,
#   columns = 5          – reconstruction only: frames in a grid with that many columns,
#   empty = [0, 1]       – reconstruction only: grid cells left empty (numbered row by row from 0).
# grid has only "enabled"; theory has no h (the text sets the height); drawing – the graphic is fitted into
# the box. [layout_ultrawide] is used on top of [layout] when width > 2 × height (the top-left corner stays
# empty there – a desktop widget sits there). A wallpaper config in configs/ can have its own [layout] and
# [layout_ultrawide], e.g. [layout] spectrum = { enabled = false } – merged over the tables here.

[layout]
grid           = { enabled = true }
drawing        = { x = "34.5%", y = "20%", w = "40%", h = "52%" }
theory         = { x = 50, y = 58, w = 560 }
square         = { x = 50, y = 808, w = 560, h = 252 }          # square-wave example
spectrum       = { x = 50, y = 1098, w = 560, h = 252 }
reconstruction = { x = -60, y = 78, w = 500, h = 1130 }         # one frame per item of "reconstructions"
title          = { x = -60, y = -40, w = 420, h = 96 }          # title block (author credit above it)

[layout_ultrawide]
drawing        = { x = "41.5%", y = "17%", w = "44%", h = "60%" }
theory         = { x = 960, y = 78, w = 520 }
square         = { x = 60, y = 948, w = 660, h = 392 }
spectrum       = { x = 790, y = 948, w = 690, h = 392 }
