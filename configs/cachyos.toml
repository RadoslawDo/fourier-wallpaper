# CachyOS logo. ../config.toml holds the defaults – any section from there ([general], [colors], [layout]…)
# can be overridden here, key by key. A layout from layouts/ (layouts in a recipe) is applied on top of it.
#
# [wallpaper] keys: name (in the file name), tag (on the title block), graphic – an SVG file (relative
# to this file). Outline = outer contour of the graphic; separate small shapes next to it (like logo
# dots) are found automatically. Small shapes INSIDE (pupils) have to be pointed to in "extras":
# x, y – position as a fraction of the width/height of the whole SVG canvas, type:
#   "shape"  – the whole single-colour shape at that point (circle or ellipse),
#   "circle" – the largest disc that fits in that colour (when the shape merges with other lines).
# texts.<language>: noun (in Polish in the genitive case), closing (last paragraph of the theory),
# spectrum (note under the spectrum header), author (credit above the title block) – all optional.

# the logo with its dots is wide: a wider box keeps it as large as the height allows
[layout]
drawing = { x = "32.5%", w = "44%" }
[layout_ultrawide]
drawing = { x = "41.5%", w = "44%" }

[wallpaper]
name = "cachyos"
graphic = "../graphics/cachyos.svg"           # /usr/share/icons/cachyos.svg
tag = "CACHYOS"
[wallpaper.texts.en]
noun = "logo"
closing = "A circle is exactly one term, so each of the three dots of the logo is drawn by a single vector. The sharp corners of the “C” need many – the more circles, the sharper they get (right-hand column)."
spectrum = "falls off as 1/n², like for any polygon"
[wallpaper.texts.pl]
noun = "logo"
closing = "Okrąg to dokładnie jeden składnik, dlatego każdą z trzech kropek logo rysuje jeden wektor. Ostre narożniki „C” wymagają wielu – im więcej okręgów, tym ostrzejsze (kolumna po prawej)."
spectrum = "maleje jak 1/n², jak w każdym wielokącie"
